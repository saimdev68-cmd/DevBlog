{% extends "base.html" %}

{% block title %}404 - Page Not Found - DevBlog{% endblock %}

{% block content %}
<div class="container section" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 350px); text-align: center;">
    <div style="max-width: 500px;">
        <span class="badge badge-warning" style="margin-bottom: 1rem; font-size: 0.85rem; padding: 0.35rem 0.8rem;">Error 404</span>
        <h1 style="font-size: 2.75rem; margin-bottom: 0.75rem;">Page Not Found</h1>
        <p class="text-muted" style="font-size: 1.1rem; margin-bottom: 2rem;">
            The page or article you are looking for might have been moved, renamed, or is temporarily unavailable.
        </p>
        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">Return to Homepage</a>
            <a href="{% url 'blog:post_list' %}" class="btn btn-outline btn-lg">Browse Articles</a>
        </div>
    </div>
</div>
{% endblock %}
