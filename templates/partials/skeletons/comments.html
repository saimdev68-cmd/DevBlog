<section class="comments-section comments-skeleton" aria-busy="true" aria-label="Loading comments...">
    <!-- Header -->
    <div class="flex items-center justify-between" style="margin-bottom: 1.5rem;">
        <div class="skeleton skeleton-title" style="width: 160px; height: 1.5rem; margin-bottom: 0;"></div>
        <div class="skeleton skeleton-badge" style="width: 140px; height: 1.3rem;"></div>
    </div>

    <!-- Comment Form Box Skeleton -->
    <div class="card" style="padding: 1.5rem; margin-bottom: 2.5rem;">
        <div class="skeleton skeleton-title" style="width: 180px; height: 1.15rem; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="width: 100%; height: 90px; border-radius: var(--radius-sm); margin-bottom: 1rem;"></div>
        <div class="skeleton skeleton-btn" style="width: 130px; height: 2.2rem;"></div>
    </div>

    <!-- 3 Comment Card Skeletons -->
    <div class="comments-list">
        <!-- Comment 1 -->
        <div class="skeleton-comment-card" aria-hidden="true">
            <div class="flex items-center gap-3" style="margin-bottom: 0.85rem;">
                <div class="skeleton skeleton-avatar skeleton-avatar-sm"></div>
                <div>
                    <div class="skeleton" style="width: 120px; height: 0.85rem; margin-bottom: 0.35rem;"></div>
                    <div class="skeleton" style="width: 70px; height: 0.7rem;"></div>
                </div>
            </div>
            <div class="skeleton skeleton-text skeleton-w-100"></div>
            <div class="skeleton skeleton-text skeleton-w-75"></div>
        </div>

        <!-- Comment 2 -->
        <div class="skeleton-comment-card" aria-hidden="true">
            <div class="flex items-center gap-3" style="margin-bottom: 0.85rem;">
                <div class="skeleton skeleton-avatar skeleton-avatar-sm"></div>
                <div>
                    <div class="skeleton" style="width: 100px; height: 0.85rem; margin-bottom: 0.35rem;"></div>
                    <div class="skeleton" style="width: 65px; height: 0.7rem;"></div>
                </div>
            </div>
            <div class="skeleton skeleton-text skeleton-w-95"></div>
            <div class="skeleton skeleton-text skeleton-w-85"></div>
            <div class="skeleton skeleton-text skeleton-w-40"></div>
        </div>

        <!-- Comment 3 -->
        <div class="skeleton-comment-card" aria-hidden="true">
            <div class="flex items-center gap-3" style="margin-bottom: 0.85rem;">
                <div class="skeleton skeleton-avatar skeleton-avatar-sm"></div>
                <div>
                    <div class="skeleton" style="width: 140px; height: 0.85rem; margin-bottom: 0.35rem;"></div>
                    <div class="skeleton" style="width: 80px; height: 0.7rem;"></div>
                </div>
            </div>
            <div class="skeleton skeleton-text skeleton-w-100"></div>
            <div class="skeleton skeleton-text skeleton-w-60"></div>
        </div>
    </div>
</section>
