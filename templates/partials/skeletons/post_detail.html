<article class="section post-detail-skeleton" style="padding-top: 2.5rem;" aria-busy="true" aria-label="Loading article content...">
    <div class="container-narrow">
        <!-- Breadcrumbs Skeleton -->
        <div class="flex items-center gap-2" style="margin-bottom: 2rem;">
            <div class="skeleton" style="width: 45px; height: 0.8rem;"></div>
            <span style="color: var(--color-border);">&rsaquo;</span>
            <div class="skeleton" style="width: 55px; height: 0.8rem;"></div>
            <span style="color: var(--color-border);">&rsaquo;</span>
            <div class="skeleton" style="width: 70px; height: 0.8rem;"></div>
            <span style="color: var(--color-border);">&rsaquo;</span>
            <div class="skeleton" style="width: 140px; height: 0.8rem;"></div>
        </div>

        <!-- Article Header Skeleton -->
        <header class="article-header" style="margin-bottom: 2.5rem;">
            <div class="skeleton skeleton-badge" style="width: 95px; height: 1.3rem; margin-bottom: 1.25rem;"></div>
            <div class="skeleton skeleton-title-lg skeleton-w-100" style="height: 2.75rem; margin-bottom: 0.85rem;"></div>
            <div class="skeleton skeleton-title skeleton-w-75" style="height: 2rem; margin-bottom: 1.5rem;"></div>

            <!-- Excerpt -->
            <div class="skeleton-paragraph" style="margin-bottom: 2rem;">
                <div class="skeleton skeleton-text skeleton-w-100" style="height: 1.15rem;"></div>
                <div class="skeleton skeleton-text skeleton-w-85" style="height: 1.15rem;"></div>
            </div>

            <!-- Meta Bar -->
            <div class="article-meta-bar" style="display: flex; align-items: center; gap: 0.75rem; padding: 1.25rem 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);">
                <div class="skeleton skeleton-avatar skeleton-avatar-sm"></div>
                <div class="skeleton skeleton-text" style="width: 110px; height: 0.9rem; margin-bottom: 0;"></div>
                <span>&bull;</span>
                <div class="skeleton skeleton-text" style="width: 85px; height: 0.8rem; margin-bottom: 0;"></div>
                <span>&bull;</span>
                <div class="skeleton skeleton-text" style="width: 65px; height: 0.8rem; margin-bottom: 0;"></div>
                <span>&bull;</span>
                <div class="skeleton skeleton-text" style="width: 55px; height: 0.8rem; margin-bottom: 0;"></div>
            </div>
        </header>

        <!-- Featured Image Skeleton -->
        <div style="margin-bottom: 3rem; text-align: center;">
            <div class="skeleton" style="width: 100%; height: 420px; border-radius: var(--radius-md);"></div>
        </div>

        <!-- Long-Form Article Body Skeleton -->
        <div class="article-body">
            <!-- Paragraph 1 -->
            <div class="skeleton-paragraph">
                <div class="skeleton skeleton-text skeleton-w-100"></div>
                <div class="skeleton skeleton-text skeleton-w-95"></div>
                <div class="skeleton skeleton-text skeleton-w-90"></div>
                <div class="skeleton skeleton-text skeleton-w-75"></div>
            </div>

            <!-- Paragraph 2 -->
            <div class="skeleton-paragraph">
                <div class="skeleton skeleton-text skeleton-w-100"></div>
                <div class="skeleton skeleton-text skeleton-w-90"></div>
                <div class="skeleton skeleton-text skeleton-w-85"></div>
                <div class="skeleton skeleton-text skeleton-w-65"></div>
            </div>

            <!-- Subheading -->
            <div class="skeleton skeleton-title skeleton-w-50" style="margin: 2.5rem 0 1rem;"></div>

            <!-- Code Block Placeholder (Dark editorial surface) -->
            <div class="skeleton-code-block" aria-hidden="true">
                <div class="skeleton-code-line skeleton-w-65"></div>
                <div class="skeleton-code-line skeleton-w-85" style="margin-left: 1.5rem;"></div>
                <div class="skeleton-code-line skeleton-w-70" style="margin-left: 1.5rem;"></div>
                <div class="skeleton-code-line skeleton-w-95" style="margin-left: 3rem;"></div>
                <div class="skeleton-code-line skeleton-w-40" style="margin-left: 1.5rem;"></div>
                <div class="skeleton-code-line skeleton-w-25"></div>
            </div>

            <!-- Paragraph 3 -->
            <div class="skeleton-paragraph" style="margin-top: 2rem;">
                <div class="skeleton skeleton-text skeleton-w-100"></div>
                <div class="skeleton skeleton-text skeleton-w-95"></div>
                <div class="skeleton skeleton-text skeleton-w-80"></div>
            </div>
        </div>

        <!-- Tags Skeleton -->
        <div class="flex items-center gap-2" style="margin: 2.5rem 0 1.5rem; flex-wrap: wrap;">
            <div class="skeleton" style="width: 70px; height: 0.9rem;"></div>
            <div class="skeleton skeleton-badge" style="width: 65px; height: 1.4rem;"></div>
            <div class="skeleton skeleton-badge" style="width: 80px; height: 1.4rem;"></div>
            <div class="skeleton skeleton-badge" style="width: 60px; height: 1.4rem;"></div>
        </div>

        <!-- Like & Share Bar Skeleton -->
        <div class="article-actions-bar" style="display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); margin: 2.5rem 0;">
            <div class="skeleton" style="width: 90px; height: 2.4rem; border-radius: var(--radius-sm);"></div>
            <div class="flex items-center gap-2">
                <div class="skeleton" style="width: 50px; height: 1rem;"></div>
                <div class="skeleton" style="width: 95px; height: 2rem; border-radius: var(--radius-sm);"></div>
                <div class="skeleton" style="width: 80px; height: 2rem; border-radius: var(--radius-sm);"></div>
            </div>
        </div>

        <!-- Author Bio Card Skeleton -->
        <div class="card" style="padding: 2rem; margin: 3rem 0; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
            <div class="skeleton skeleton-avatar skeleton-avatar-lg"></div>
            <div style="flex: 1; min-width: 240px;">
                <div class="skeleton skeleton-title" style="width: 160px; height: 1.25rem; margin-bottom: 0.5rem;"></div>
                <div class="skeleton skeleton-text skeleton-w-90"></div>
                <div class="skeleton skeleton-text skeleton-w-65" style="margin-bottom: 0.75rem;"></div>
                <div class="flex gap-2">
                    <div class="skeleton" style="width: 50px; height: 0.8rem;"></div>
                    <div class="skeleton" style="width: 50px; height: 0.8rem;"></div>
                </div>
            </div>
        </div>

        <!-- Next / Previous Article Navigation Skeleton -->
        <div class="flex items-center justify-between gap-4" style="margin: 2.5rem 0; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
            <div style="width: 45%;">
                <div class="skeleton" style="width: 100px; height: 0.7rem; margin-bottom: 0.4rem;"></div>
                <div class="skeleton skeleton-title skeleton-w-90" style="height: 1.1rem; margin-bottom: 0;"></div>
            </div>
            <div style="width: 45%; text-align: right; display: flex; flex-direction: column; align-items: flex-end;">
                <div class="skeleton" style="width: 100px; height: 0.7rem; margin-bottom: 0.4rem;"></div>
                <div class="skeleton skeleton-title skeleton-w-90" style="height: 1.1rem; margin-bottom: 0;"></div>
            </div>
        </div>

        <!-- Comments Section Skeleton -->
        {% include "partials/skeletons/comments.html" %}
    </div>

    <!-- Related Articles Skeleton -->
    <div class="container" style="margin-top: 5rem; padding-top: 3.5rem; border-top: 1px solid var(--color-border);">
        <div class="skeleton skeleton-title" style="width: 200px; height: 1.75rem; margin: 0 auto 2.5rem;"></div>
        <div class="grid grid-cols-3 gap-6">
            {% include "partials/skeletons/post_card.html" %}
            {% include "partials/skeletons/post_card.html" %}
            {% include "partials/skeletons/post_card.html" %}
        </div>
    </div>
</article>
