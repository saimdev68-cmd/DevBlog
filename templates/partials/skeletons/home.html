<div class="home-skeleton-wrapper" aria-busy="true" aria-label="Loading homepage content...">
    <!-- Hero Section Skeleton -->
    <section class="skeleton-hero">
        <div class="skeleton skeleton-badge" style="width: 170px; height: 1.6rem; margin: 0 auto 1.5rem;"></div>
        <div class="skeleton skeleton-title-lg" style="margin: 0 auto 1.25rem; width: 450px; height: 3.25rem;"></div>
        <div class="skeleton-paragraph" style="max-width: 620px; margin: 0 auto 2rem;">
            <div class="skeleton skeleton-text skeleton-w-100" style="height: 1.1rem;"></div>
            <div class="skeleton skeleton-text skeleton-w-85" style="height: 1.1rem; margin: 0 auto;"></div>
        </div>
        <div class="flex items-center justify-center gap-3">
            <div class="skeleton skeleton-btn" style="width: 150px; height: 2.75rem;"></div>
            <div class="skeleton skeleton-btn" style="width: 150px; height: 2.75rem;"></div>
        </div>
    </section>

    <div class="container section">
        <!-- Featured Article Skeleton -->
        <section class="skeleton-featured-card" aria-hidden="true">
            <div class="skeleton skeleton-featured-img"></div>
            <div class="skeleton-featured-content">
                <div class="skeleton skeleton-badge" style="width: 120px; height: 1.2rem; margin-bottom: 0.85rem;"></div>
                <div class="skeleton skeleton-title-lg skeleton-w-95" style="height: 2.2rem; margin-bottom: 0.85rem;"></div>
                <div class="skeleton skeleton-title skeleton-w-70" style="height: 1.5rem; margin-bottom: 1.5rem;"></div>
                
                <div class="skeleton-paragraph" style="margin-bottom: 2rem;">
                    <div class="skeleton skeleton-text skeleton-w-100"></div>
                    <div class="skeleton skeleton-text skeleton-w-95"></div>
                    <div class="skeleton skeleton-text skeleton-w-65"></div>
                </div>

                <div class="flex items-center justify-between" style="padding-top: 1.25rem; border-top: 1px solid var(--color-border);">
                    <div class="flex items-center gap-2">
                        <div class="skeleton skeleton-avatar skeleton-avatar-sm"></div>
                        <div class="skeleton skeleton-text" style="width: 110px; height: 0.85rem; margin-bottom: 0;"></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="skeleton skeleton-meta" style="width: 40px;"></div>
                        <div class="skeleton skeleton-meta" style="width: 65px;"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Latest Articles Grid Skeleton -->
        <section class="section-sm">
            <div class="flex items-center justify-between" style="margin-bottom: 2rem;">
                <div>
                    <div class="skeleton skeleton-title" style="width: 240px; height: 1.6rem; margin-bottom: 0.4rem;"></div>
                    <div class="skeleton skeleton-text" style="width: 340px; height: 0.85rem;"></div>
                </div>
                <div class="skeleton" style="width: 100px; height: 2rem; border-radius: var(--radius-sm);"></div>
            </div>

            <div class="grid grid-cols-3 gap-6">
                {% include "partials/skeletons/post_card.html" %}
                {% include "partials/skeletons/post_card.html" %}
                {% include "partials/skeletons/post_card.html" %}
            </div>
        </section>

        <!-- Topics / Categories Skeleton -->
        <section class="section-sm" style="margin-top: 2rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="skeleton skeleton-title" style="width: 180px; height: 1.6rem; margin: 0 auto 0.4rem;"></div>
                <div class="skeleton skeleton-text" style="width: 260px; height: 0.85rem; margin: 0 auto;"></div>
            </div>
            <div class="flex items-center justify-center gap-3" style="flex-wrap: wrap;">
                <div class="skeleton" style="width: 130px; height: 2.75rem; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="width: 115px; height: 2.75rem; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="width: 145px; height: 2.75rem; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="width: 125px; height: 2.75rem; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="width: 140px; height: 2.75rem; border-radius: var(--radius-md);"></div>
            </div>
        </section>
    </div>
</div>
