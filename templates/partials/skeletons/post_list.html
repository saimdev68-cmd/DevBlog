<div class="post-list-skeleton-wrapper" aria-busy="true" aria-label="Loading publications...">
    <!-- Header Skeleton -->
    <div style="max-width: 800px; margin: 0 auto 3rem; text-align: center;">
        <div class="skeleton skeleton-title-lg" style="margin: 0 auto 1rem; width: 380px;"></div>
        <div class="skeleton skeleton-text skeleton-w-70" style="margin: 0 auto;"></div>
    </div>

    <!-- Filter & Search Bar Skeleton -->
    <div class="card" style="padding: 1.25rem 1.5rem; margin-bottom: 2.5rem;">
        <div class="flex items-center justify-between gap-4" style="flex-wrap: wrap;">
            <div class="flex items-center gap-2" style="flex-wrap: wrap;">
                <div class="skeleton skeleton-badge" style="width: 110px; height: 1.8rem;"></div>
                <div class="skeleton skeleton-badge" style="width: 90px; height: 1.8rem;"></div>
                <div class="skeleton skeleton-badge" style="width: 80px; height: 1.8rem;"></div>
                <div class="skeleton skeleton-badge" style="width: 95px; height: 1.8rem;"></div>
                <div class="skeleton skeleton-badge" style="width: 85px; height: 1.8rem;"></div>
            </div>
            <div class="skeleton" style="width: 280px; height: 2.25rem; border-radius: var(--radius-sm);"></div>
        </div>
    </div>

    <!-- 6 Card Grid Skeleton -->
    <div class="grid grid-cols-3 gap-6" style="margin-bottom: 3.5rem;">
        {% include "partials/skeletons/post_card.html" %}
        {% include "partials/skeletons/post_card.html" %}
        {% include "partials/skeletons/post_card.html" %}
        {% include "partials/skeletons/post_card.html" %}
        {% include "partials/skeletons/post_card.html" %}
        {% include "partials/skeletons/post_card.html" %}
    </div>

    <!-- Pagination Skeleton -->
    <div class="flex items-center justify-center gap-2" style="margin-top: 3rem;">
        <div class="skeleton" style="width: 85px; height: 2.2rem; border-radius: var(--radius-sm);"></div>
        <div class="skeleton" style="width: 38px; height: 2.2rem; border-radius: var(--radius-sm);"></div>
        <div class="skeleton" style="width: 38px; height: 2.2rem; border-radius: var(--radius-sm);"></div>
        <div class="skeleton" style="width: 38px; height: 2.2rem; border-radius: var(--radius-sm);"></div>
        <div class="skeleton" style="width: 85px; height: 2.2rem; border-radius: var(--radius-sm);"></div>
    </div>
</div>
