{% extends "base.html" %}

{% block title %}403 - Access Forbidden - DevBlog{% endblock %}

{% block content %}
<div class="container section" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 350px); text-align: center;">
    <div style="max-width: 500px;">
        <span class="badge badge-error" style="margin-bottom: 1rem; font-size: 0.85rem; padding: 0.35rem 0.8rem;">Error 403</span>
        <h1 style="font-size: 2.75rem; margin-bottom: 0.75rem;">Access Forbidden</h1>
        <p class="text-muted" style="font-size: 1.1rem; margin-bottom: 2rem;">
            You do not have administrative permission to view or modify this resource.
        </p>
        <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">Return to Homepage</a>
    </div>
</div>
{% endblock %}
