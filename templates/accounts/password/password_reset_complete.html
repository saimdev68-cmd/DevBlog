{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete - DevBlog{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card text-center">
        <!-- Brand Header inside Container -->
        <div style="margin-bottom: 2rem;">
            <a href="{% url 'core:home' %}" class="nav-brand" style="justify-content: center; margin-bottom: 0.85rem; text-decoration: none;">
                <img src="{% static 'images/logo.svg' %}" alt="DevBlog Logo" class="nav-brand-logo" width="38" height="38">
                <span style="font-size: 1.45rem;">Dev<span class="brand-accent">Blog</span></span>
            </a>
            <div style="width: 52px; height: 52px; background: #F0FDF4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 1rem auto 1rem; color: #166534;">
                <svg viewBox="0 0 20 20" fill="currentColor" width="28" height="28">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
            </div>
            <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Password Updated</h1>
            <p class="text-muted text-sm" style="line-height: 1.6; max-width: 360px; margin: 0 auto;">
                Your password has been reset successfully. You can now sign in with your new password.
            </p>
        </div>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-full">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
