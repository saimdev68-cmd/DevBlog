{% extends "base.html" %}

{% block title %}Password Changed Successfully - DevBlog{% endblock %}

{% block content %}
<div class="container section" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 350px);">
    <div class="card text-center" style="max-width: 480px; padding: 2.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔒</div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Password Updated</h1>
        <p class="text-muted" style="margin-bottom: 2rem;">Your account password has been updated successfully. You can now use your new password next time you sign in.</p>
        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'accounts:author_profile' user.pk %}" class="btn btn-primary w-full">View My Profile</a>
            <a href="{% url 'core:home' %}" class="btn btn-outline w-full">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
