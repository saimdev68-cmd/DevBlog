<!DOCTYPE html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>500 - Server Error - DevBlog</title>
    <style>
        :root {
            --color-bg: #FAF9F7;
            --color-card: #FFFFFF;
            --color-text: #17151A;
            --color-muted: #6F6A73;
            --color-primary: #6B3F69;
            --color-primary-hover: #563154;
            --color-border: #E8E4DF;
            --color-error: #B91C1C;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Helvetica Neue, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.6;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            box-shadow: 0 4px 12px rgba(23, 21, 26, 0.05);
            text-align: center;
        }
        .error-badge {
            display: inline-block;
            background: rgba(185, 28, 28, 0.08);
            color: var(--color-error);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            letter-spacing: 0.03em;
        }
        h1 {
            font-family: 'Newsreader', 'Georgia', serif;
            font-size: 2.25rem;
            color: var(--color-text);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }
        p {
            color: var(--color-muted);
            font-size: 1.05rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--color-primary);
            color: #FFFFFF;
            padding: 0.8rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: var(--color-primary-hover);
        }
    </style>
</head>
<body>
    <div class=error-card>
        <span class=error-badge>Error 500</span>
        <h1>Server Error</h1>
        <p>An unexpected condition was encountered. Our team has been notified and is looking into the issue.</p>
        <a href=/ class=btn>Return to Homepage</a>
    </div>
</body>
</html>
