<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734270" />
      <stop offset="100%" stop-color="#461E44" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A291" />
      <stop offset="100%" stop-color="#D98C7A" />
    </linearGradient>
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF9F7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17151A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Drop Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.18" />

  <!-- Code / Publication Mark: < / > -->
  <!-- Left Bracket < -->
  <path d="M 44 42 L 27 60 L 44 78" fill="none" stroke="url(#ivoryGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Forward Slash / in Coral -->
  <path d="M 68 36 L 52 84" fill="none" stroke="url(#coralGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M 76 42 L 93 60 L 76 78" fill="none" stroke="url(#ivoryGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent Coral Spark / Beacon -->
  <circle cx="95" cy="35" r="4.5" fill="url(#coralGrad)" />
</svg>
